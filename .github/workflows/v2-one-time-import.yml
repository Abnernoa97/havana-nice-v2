name: HAVANA NICE V2 - one-time isolated import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v2-one-time-import.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-v2-independent-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'Abnernoa97/havana-nice-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout independent repository
        uses: actions/checkout@v4
        with:
          path: target
      - name: Checkout only frozen V2 branch in read-only mode
        uses: actions/checkout@v4
        with:
          repository: Abnernoa97/havana-nice-pwa
          ref: 3d1015ab7d6571b7e0a893962034d0bd1ab6b509
          path: source
          persist-credentials: false
      - name: Copy V2 source only, preserving binary icons and no original Git history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = 3d1015ab7d6571b7e0a893962034d0bd1ab6b509
          test -d target/.git && test -f source/v2/apps/android/App.tsx
          test -f source/v2/cloudflare/src/index.ts
          test ! -e target/apps && test ! -e target/cloudflare
          cp -a source/v2/. target/
          test -s target/apps/pwa/public/icons/havana-nice-512.png
          test -s target/apps/android/App.tsx
          test -s target/cloudflare/src/index.ts
          rm -f target/.github/workflows/v2-one-time-import.yml
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add -A
          git -C target -c core.whitespace=-trailing-space,-blank-at-eof diff --cached --check
          git -C target commit -m "Initialize standalone V2 main from isolated source snapshot"
          git -C target push origin HEAD:main
      - name: Preserve original signed APK and previous APK as independent Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v2-apks"
          git -C source fetch --depth 1 origin havana-nice-v2-apk-downloads
          git -C source show FETCH_HEAD:HAVANA-NICE-V2-LATEST.apk > "$RUNNER_TEMP/v2-apks/HAVANA-NICE-V2-LATEST.apk"
          git -C source show FETCH_HEAD:HAVANA-NICE-V2-PREVIOUS.apk > "$RUNNER_TEMP/v2-apks/HAVANA-NICE-V2-PREVIOUS.apk"
          git -C source show FETCH_HEAD:SHA256SUMS.txt > "$RUNNER_TEMP/v2-apks/SHA256SUMS-OLD.txt"
          cd "$RUNNER_TEMP/v2-apks"
          test -s HAVANA-NICE-V2-LATEST.apk && test -s HAVANA-NICE-V2-PREVIOUS.apk
          for apk in HAVANA-NICE-V2-LATEST.apk HAVANA-NICE-V2-PREVIOUS.apk; do
            grep -F "  $apk" SHA256SUMS-OLD.txt | sha256sum -c -
          done
          sha256sum HAVANA-NICE-V2-LATEST.apk HAVANA-NICE-V2-PREVIOUS.apk > SHA256SUMS.txt
          gh release create v2-android-current --repo "$GITHUB_REPOSITORY" --title "HAVANA NICE V2 Android" --notes "Signed Android APK and verified previous version migrated from original V2 branch. No original source history." HAVANA-NICE-V2-LATEST.apk HAVANA-NICE-V2-PREVIOUS.apk SHA256SUMS.txt
          gh release view v2-android-current --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
